name: Zostavenie inštalátorov

on:
  push:
    # dev: len kontrola a zostavenie (bez zverejnenia); main: zverejnenie latest-build
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zostavenie (${{ matrix.label }})
    strategy:
      fail-fast: false
      # dev: len Linux (kontrola typov, dymový test, balík závislostí pre vývoj) – Windows a Mac sa zostavujú
      # až pri vydaní (main) alebo ručnom spustení, aby sa zbytočne nekompilovali pri každom zápise do dev.
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '[{"os":"windows-latest","label":"windows"},{"os":"ubuntu-latest","label":"linux"}]' || '[{"os":"ubuntu-latest","label":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Inštalácia závislostí
        run: |
          mkdir -p ci
          # npm ci so zámkom; ak zámok nesedí s package.json (nové balíky), npm install ho aktualizuje
          set +e +o pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund 2>&1 | tee ci/install.log
            if [ ${PIPESTATUS[0]} -eq 0 ]; then exit 0; fi
            echo "--- npm ci zlyhalo, skúšam npm install ---" | tee -a ci/install.log
          fi
          npm install --no-audit --no-fund 2>&1 | tee -a ci/install.log
          exit ${PIPESTATUS[0]}

      # Balík závislostí (bez binárky Electronu) pre kontrolu typov v prostredí Claude.
      - name: Balík závislostí pre vývoj
        if: matrix.label == 'linux'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar --exclude='node_modules/electron/dist' -czf "$RUNNER_TEMP/node_modules.tgz" node_modules
          ls -la "$RUNNER_TEMP/node_modules.tgz"
          gh release view dev-deps >/dev/null 2>&1 || gh release create dev-deps --prerelease --title "Závislosti pre vývoj (nie pre používateľa)" --notes "Pomocný balík pre kontrolu typov."
          gh release upload dev-deps "$RUNNER_TEMP/node_modules.tgz" --clobber

      - name: Kontrola typov
        continue-on-error: true
        run: |
          npm run typecheck 2>&1 | tee ci/typecheck.log
          exit ${PIPESTATUS[0]}

      # Windows: inštalátor (Squirrel). Linux: len zabalenie aplikácie pre dymový test (Linux sa nezverejňuje).
      - name: Zostavenie inštalátora
        run: |
          if [ "${{ matrix.label }}" = linux ]; then npx electron-forge package 2>&1 | tee ci/make.log; else npm run make 2>&1 | tee ci/make.log; fi
          exit ${PIPESTATUS[0]}

      # Druhý inštalátor pre Windows: klasický sprievodca Inno Setup (pre všetkých / len pre mňa, Program Files,
      # odinštalovanie v Nastaveniach). Inno Setup sa z novších obrazov Windows odstraňuje → nainštalovať, ak chýba.
      - name: Windows – inštalátor Inno Setup
        if: matrix.label == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          $ver = node -p "require('./package.json').version"
          $src = (Resolve-Path "out\MailKlient-win32-x64").Path
          New-Item -ItemType Directory -Force out\make\inno | Out-Null
          $out = (Resolve-Path "out\make\inno").Path
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$src" "/DOutDir=$out" installer\universum.iss 2>&1 | Tee-Object -FilePath ci\inno.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out\make\inno | Tee-Object -Append -FilePath ci\inno.log

      # Dymový test: aplikácia musí naštartovať a 25 s bežať bez pádu (Linux, virtuálny displej).
      - name: Dymový test spustenia
        if: matrix.label == 'linux'
        run: |
          sudo apt-get install -y -q xvfb imagemagick >/dev/null
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          ./out/MailKlient-linux-x64/MailKlient --no-sandbox --enable-logging=stderr > ci/smoke.log 2>&1 &
          pid=$!
          sleep 20
          import -window root ci/screenshot.png || true
          if kill -0 $pid 2>/dev/null; then echo "beží" | tee -a ci/smoke.log; kill $pid; else echo "SPADLA" | tee -a ci/smoke.log; exit 1; fi
          sleep 2
          # druhý beh: ukážkové konto M365 (vložený Outlook na webe) a pravý panel
          MAILKLIENT_SMOKE=m365 ./out/MailKlient-linux-x64/MailKlient --no-sandbox --enable-logging=stderr > ci/smoke-m365.log 2>&1 &
          pid=$!
          sleep 30
          import -window root ci/screenshot-m365.png || true
          if kill -0 $pid 2>/dev/null; then echo "beží (m365)" | tee -a ci/smoke.log; kill $pid; else echo "SPADLA (m365)" | tee -a ci/smoke.log; exit 1; fi
          sleep 2
          # tretí beh: písanie odpovede v čítacom paneli (ukážkové dáta)
          MAILKLIENT_SMOKE=compose ./out/MailKlient-linux-x64/MailKlient --no-sandbox --enable-logging=stderr > ci/smoke-compose.log 2>&1 &
          pid=$!
          sleep 15
          import -window root ci/screenshot-compose.png || true
          if kill -0 $pid 2>/dev/null; then echo "beží (compose)" | tee -a ci/smoke.log; kill $pid; else echo "SPADLA (compose)" | tee -a ci/smoke.log; exit 1; fi

      - name: Zoznam výstupov
        if: always()
        run: (find out/make -type f 2>/dev/null || echo "out/make neexistuje") | tee ci/outputs.log

      - uses: actions/upload-artifact@v4
        if: success() && matrix.label == 'windows'
        with:
          name: mailklient-${{ matrix.label }}
          retention-days: 3
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.nupkg
            out/make/**/RELEASES
          if-no-files-found: warn

      # Logy a vygenerovaný package-lock.json do vetvy ci-logs-<os> (na diagnostiku chýb).
      - name: Uloženie logov
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/logs"; mkdir -p "$dir"
          cp ci/*.log ci/*.png "$dir"/ 2>/dev/null || true
          cp package-lock.json "$dir"/ 2>/dev/null || true
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} job=${{ job.status }}" > "$dir/status.txt"
          cd "$dir"
          git init -q
          git checkout -q -b "ci-logs-${{ matrix.label }}"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logy ${GITHUB_SHA} (${{ job.status }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD

  # macOS zostavené priamo na Macu (Apple Silicon): balík .app, ad-hoc podpis Apple codesign, .dmg (hdiutil)
  # a .zip (ditto – zachová odkazy vo frameworkoch). Dymový test: aplikácia musí na Macu naštartovať a bežať.
  mac:
    name: Zostavenie (macos)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Inštalácia závislostí
        run: |
          mkdir -p ci
          set +e +o pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund 2>&1 | tee ci/install.log
            if [ ${PIPESTATUS[0]} -eq 0 ]; then exit 0; fi
          fi
          npm install --no-audit --no-fund 2>&1 | tee -a ci/install.log
          exit ${PIPESTATUS[0]}

      - name: Zostavenie, podpis, DMG a ZIP
        run: |
          set -eo pipefail
          sw_vers | tee ci/mac.log
          npx electron-forge package --platform=darwin --arch=arm64 2>&1 | tee -a ci/mac.log
          src=$(ls -d out/*-darwin-arm64/*.app | head -1)
          stage="$RUNNER_TEMP/stage"; mkdir -p "$stage"
          app="$stage/Universum eMail.app"
          ditto "$src" "$app"
          codesign --force --deep --sign - "$app" 2>&1 | tee -a ci/mac.log
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -5 | tee -a ci/mac.log
          # kontrola súčastí, ktoré pri poškodenej kópii chýbajú
          test -e "$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          ls -la "$app/Contents/Frameworks/Electron Framework.framework/" | tee -a ci/mac.log
          ver=$(node -p "require('./package.json').version")
          mkdir -p out/mac
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/mac/UniversumEmail-macOS-${ver}.zip"
          ln -s /Applications "$stage/Aplikácie"
          hdiutil create -volname "Universum eMail" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "out/mac/UniversumEmail-macOS-${ver}.dmg" 2>&1 | tee -a ci/mac.log
          ls -la out/mac | tee -a ci/mac.log

      - name: Dymový test na Macu
        run: |
          set +e
          ver=$(node -p "require('./package.json').version")
          mnt=$(hdiutil attach -nobrowse -readonly "out/mac/UniversumEmail-macOS-${ver}.dmg" | tail -1 | awk -F'\t' '{print $NF}')
          echo "pripojené: $mnt" | tee ci/smoke.log
          rm -rf "$RUNNER_TEMP/apps"; mkdir -p "$RUNNER_TEMP/apps"
          ditto "$mnt/Universum eMail.app" "$RUNNER_TEMP/apps/Universum eMail.app"
          hdiutil detach "$mnt" -quiet
          "$RUNNER_TEMP/apps/Universum eMail.app/Contents/MacOS/MailKlient" --enable-logging=stderr >> ci/smoke.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then echo "beží" | tee -a ci/smoke.log; kill $pid; exit 0; fi
          echo "SPADLA" | tee -a ci/smoke.log
          exit 1

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mailklient-macos
          retention-days: 3
          path: out/mac/*
          if-no-files-found: error

      - name: Uloženie logov
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/logs"; mkdir -p "$dir"
          cp ci/*.log "$dir"/ 2>/dev/null || true
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} job=${{ job.status }}" > "$dir/status.txt"
          cd "$dir"
          git init -q
          git checkout -q -b ci-logs-macos
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logy ${GITHUB_SHA} (${{ job.status }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD || true

  release:
    name: Zverejnenie (latest-build)
    needs: [build, mac]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release latest-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p files
          # Windows (Squirrel + Inno) a Mac (DMG + ZIP); Linux sa nezverejňuje
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.nupkg' -o -name 'RELEASES' \) -exec cp {} files/ \;
          ls -la files
          if [ -z "$(ls -A files)" ]; then echo "Žiadne inštalátory, release preskakujem."; exit 0; fi
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build files/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Najnovšie zostavenie" \
            --notes "Automaticky zostavené z commitu ${GITHUB_SHA::7}. Windows: MailKlient-Setup.exe (rýchla inštalácia pre teba) alebo UniversumEmail-Setup.exe (klasický sprievodca: pre všetkých používateľov alebo len pre teba, výber priečinka). macOS (čip M): stiahni UniversumEmail-macOS-….dmg, otvor ho a pretiahni Universum eMail na Aplikácie (alebo .zip); pri prvom spustení pravý klik → Otvoriť, prípadne Nastavenia systému → Súkromie a bezpečnosť → Aj tak otvoriť."

