[package]
name = "mailklient-tauri"
version = "0.5.0"
description = "MailKlient – prototyp na Tauri 2 (WebView2 / jadro Edge)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
